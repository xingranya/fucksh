name: Release & Dual Sync

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: '发布版本名称 (如 1.0.0)'
        required: false
        default: '1.0.0'
      version_code:
        description: '发布版本号 (如 261)'
        required: false
        default: '261'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK via Gradle
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain || ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dual-Sync Release
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="${{ inputs.version_name }}"
          VERSION_CODE="${{ inputs.version_code }}"
          if [ -z "$VERSION_NAME" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          fi
          
          ARGS=""
          if [ -n "$VERSION_NAME" ]; then
            ARGS="$ARGS --version-name $VERSION_NAME"
          fi
          if [ -n "$VERSION_CODE" ]; then
            ARGS="$ARGS --version-code $VERSION_CODE"
          fi
          
          python3 tools/release.py $ARGS --skip-build

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fucksh-release-dist
          path: dist/*
          if-no-files-found: warn
